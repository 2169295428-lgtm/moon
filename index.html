<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态3D正方体</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Orbitron', 'Courier New', monospace;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
        }

        #canvas-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 245, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        #canvas-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 0, 255, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        canvas {
            display: block;
        }

        .title {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #00f5ff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 8px;
            text-shadow: 
                0 0 10px rgba(0, 245, 255, 0.8),
                0 0 20px rgba(0, 245, 255, 0.5),
                0 0 40px rgba(0, 245, 255, 0.3);
            z-index: 10;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { 
                opacity: 0.8;
                text-shadow: 
                    0 0 10px rgba(0, 245, 255, 0.8),
                    0 0 20px rgba(0, 245, 255, 0.5),
                    0 0 40px rgba(0, 245, 255, 0.3);
            }
            50% { 
                opacity: 1;
                text-shadow: 
                    0 0 15px rgba(0, 245, 255, 1),
                    0 0 30px rgba(0, 245, 255, 0.7),
                    0 0 60px rgba(0, 245, 255, 0.5);
            }
        }

        .subtitle {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 0, 255, 0.6);
            font-size: 10px;
            letter-spacing: 4px;
            z-index: 10;
        }

        .corner-decor {
            position: fixed;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(0, 245, 255, 0.3);
            z-index: 10;
        }

        .corner-decor.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-decor.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-decor.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-decor.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="corner-decor top-left"></div>
    <div class="corner-decor top-right"></div>
    <div class="corner-decor bottom-left"></div>
    <div class="corner-decor bottom-right"></div>
    <div class="title">DYNAMIC CUBE</div>
    <div class="subtitle">THREE.JS VISUALIZATION</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        class DynamicCube {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.isHovering = false;
                this.rotationSpeed = {
                    x: 0.005,
                    y: 0.008,
                    z: 0.002
                };
                this.baseSpeed = 1;
                this.hoverSpeed = 2;

                this.init();
                this.createCube();
                this.createParticles();
                this.setupEventListeners();
                this.animate();
            }

            init() {
                this.scene = new THREE.Scene();
                
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.z = 5;

                this.renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setClearColor(0x000000, 0);
                this.container.appendChild(this.renderer.domElement);

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.enableZoom = true;
                this.controls.minDistance = 3;
                this.controls.maxDistance = 10;
                this.controls.enablePan = false;

                const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
                this.scene.add(ambientLight);

                const pointLight1 = new THREE.PointLight(0x00f5ff, 1, 100);
                pointLight1.position.set(5, 5, 5);
                this.scene.add(pointLight1);

                const pointLight2 = new THREE.PointLight(0xff00ff, 0.5, 100);
                pointLight2.position.set(-5, -5, 5);
                this.scene.add(pointLight2);

                const pointLight3 = new THREE.PointLight(0xffff00, 0.3, 100);
                pointLight3.position.set(0, 5, -5);
                this.scene.add(pointLight3);
            }

            createCube() {
                this.cubeGroup = new THREE.Group();

                const geometry = new THREE.BoxGeometry(2, 2, 2);
                
                const material = new THREE.MeshPhongMaterial({
                    color: 0x1a1a2e,
                    transparent: true,
                    opacity: 0.3,
                    shininess: 100,
                    specular: 0x00f5ff
                });
                
                this.cube = new THREE.Mesh(geometry, material);
                this.cubeGroup.add(this.cube);

                const edgesGeometry = new THREE.EdgesGeometry(geometry);
                this.edgeMaterial = new THREE.LineBasicMaterial({
                    color: 0x00f5ff,
                    transparent: true,
                    opacity: 0.6
                });
                
                this.edges = new THREE.LineSegments(edgesGeometry, this.edgeMaterial);
                this.cubeGroup.add(this.edges);

                const innerEdgesGeometry = new THREE.EdgesGeometry(
                    new THREE.BoxGeometry(2.02, 2.02, 2.02)
                );
                const innerEdgeMaterial = new THREE.LineBasicMaterial({
                    color: 0xff00ff,
                    transparent: true,
                    opacity: 0.3
                });
                this.innerEdges = new THREE.LineSegments(
                    innerEdgesGeometry, 
                    innerEdgeMaterial
                );
                this.cubeGroup.add(this.innerEdges);

                this.scene.add(this.cubeGroup);
            }

            createParticles() {
                const particleCount = 100;
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {
                    const radius = 3 + Math.random() * 3;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);

                    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = radius * Math.cos(phi);

                    const colorChoice = Math.random();
                    if (colorChoice < 0.33) {
                        colors[i * 3] = 0;
                        colors[i * 3 + 1] = 0.96;
                        colors[i * 3 + 2] = 1;
                    } else if (colorChoice < 0.66) {
                        colors[i * 3] = 1;
                        colors[i * 3 + 1] = 0;
                        colors[i * 3 + 2] = 1;
                    } else {
                        colors[i * 3] = 1;
                        colors[i * 3 + 1] = 1;
                        colors[i * 3 + 2] = 0;
                    }
                }

                const particleGeometry = new THREE.BufferGeometry();
                particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const particleMaterial = new THREE.PointsMaterial({
                    size: 0.05,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending
                });

                this.particles = new THREE.Points(particleGeometry, particleMaterial);
                this.scene.add(this.particles);
            }

            setupEventListeners() {
                window.addEventListener('resize', () => this.onResize());

                this.renderer.domElement.addEventListener('mouseenter', () => {
                    this.isHovering = true;
                });

                this.renderer.domElement.addEventListener('mouseleave', () => {
                    this.isHovering = false;
                });
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const speedMultiplier = this.isHovering ? this.hoverSpeed : this.baseSpeed;
                
                this.cubeGroup.rotation.x += this.rotationSpeed.x * speedMultiplier;
                this.cubeGroup.rotation.y += this.rotationSpeed.y * speedMultiplier;
                this.cubeGroup.rotation.z += this.rotationSpeed.z * speedMultiplier;

                const time = Date.now() * 0.001;
                const pulse = 0.3 + 0.5 * Math.sin(time * Math.PI);
                this.edgeMaterial.opacity = pulse;

                const innerPulse = 0.1 + 0.3 * Math.sin(time * Math.PI + Math.PI);
                this.innerEdges.material.opacity = innerPulse;

                this.particles.rotation.y += 0.0005;
                this.particles.rotation.x += 0.0002;

                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        const dynamicCube = new DynamicCube();
    </script>
</body>
</html>

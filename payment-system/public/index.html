<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码支付系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .qr-container {
            text-align: center;
            padding: 20px;
        }

        .qr-code {
            max-width: 280px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin: 0 auto 20px;
        }

        .order-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .order-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .order-info-row:last-child {
            border-bottom: none;
        }

        .order-info-label {
            color: #666;
        }

        .order-info-value {
            font-weight: 600;
            color: #333;
        }

        .order-info-value.amount {
            color: #f44336;
            font-size: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-paid {
            background: #d4edda;
            color: #155724;
        }

        .status-expired {
            background: #f8d7da;
            color: #721c24;
        }

        .status-cancelled {
            background: #e2e3e5;
            color: #383d41;
        }

        .countdown {
            font-size: 24px;
            font-weight: 600;
            color: #f44336;
            margin: 10px 0;
        }

        .payment-methods {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .payment-method {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .payment-method:hover {
            border-color: #667eea;
        }

        .payment-method.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .payment-method-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .payment-method-name {
            font-size: 12px;
            color: #666;
        }

        .orders-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .order-item {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .order-item:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        .order-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .order-item-id {
            font-size: 12px;
            color: #666;
        }

        .order-item-amount {
            font-weight: 600;
            color: #333;
        }

        .order-item-time {
            font-size: 11px;
            color: #999;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .success-animation {
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon {
            font-size: 64px;
            color: #4CAF50;
            margin-bottom: 16px;
        }

        .success-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .success-message {
            color: #666;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>扫码支付系统</h1>
            <p>安全、便捷、快速的支付体验</p>
        </div>

        <div class="main-grid">
            <div class="card">
                <div class="card-title">创建支付订单</div>
                
                <div id="createOrderForm">
                    <div class="form-group">
                        <label>支付金额 (元)</label>
                        <input type="number" id="amount" placeholder="请输入金额" min="0.01" step="0.01" value="0.01">
                    </div>
                    <div class="form-group">
                        <label>商品描述</label>
                        <input type="text" id="description" placeholder="请输入商品描述" value="测试商品">
                    </div>
                    <button class="btn btn-primary" onclick="createOrder()">生成支付二维码</button>
                </div>

                <div id="paymentSection" class="hidden">
                    <div class="order-info">
                        <div class="order-info-row">
                            <span class="order-info-label">订单号</span>
                            <span class="order-info-value" id="displayOrderId">-</span>
                        </div>
                        <div class="order-info-row">
                            <span class="order-info-label">商品</span>
                            <span class="order-info-value" id="displayDescription">-</span>
                        </div>
                        <div class="order-info-row">
                            <span class="order-info-label">支付金额</span>
                            <span class="order-info-value amount" id="displayAmount">¥0.00</span>
                        </div>
                        <div class="order-info-row">
                            <span class="order-info-label">订单状态</span>
                            <span id="displayStatus">-</span>
                        </div>
                    </div>

                    <div id="qrSection">
                        <div class="qr-container">
                            <img id="qrCode" class="qr-code" src="" alt="支付二维码">
                            <p style="color: #666; margin-bottom: 10px;">请使用手机扫码支付</p>
                            <div class="countdown" id="countdown">05:00</div>
                            <p style="font-size: 12px; color: #999;">请在倒计时内完成支付</p>
                        </div>

                        <div class="payment-methods">
                            <div class="payment-method selected" data-method="alipay" onclick="selectPaymentMethod(this)">
                                <div class="payment-method-icon">💳</div>
                                <div class="payment-method-name">支付宝</div>
                            </div>
                            <div class="payment-method" data-method="wechat" onclick="selectPaymentMethod(this)">
                                <div class="payment-method-icon">📱</div>
                                <div class="payment-method-name">微信支付</div>
                            </div>
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 16px;">
                            <button class="btn btn-success" onclick="simulatePay()">模拟支付</button>
                            <button class="btn btn-danger" onclick="cancelOrder()">取消订单</button>
                        </div>
                    </div>

                    <div id="successSection" class="hidden">
                        <div class="qr-container success-animation">
                            <div class="success-icon">✓</div>
                            <div class="success-title">支付成功</div>
                            <div class="success-message" id="successMessage">感谢您的支付</div>
                        </div>
                        <button class="btn btn-primary" onclick="resetForm()">继续支付</button>
                    </div>

                    <div id="failedSection" class="hidden">
                        <div class="qr-container">
                            <div style="font-size: 64px; color: #f44336; margin-bottom: 16px;">✗</div>
                            <div class="success-title" style="color: #f44336;">支付失败</div>
                            <div class="success-message" id="failedMessage">订单已取消或过期</div>
                        </div>
                        <button class="btn btn-primary" onclick="resetForm()">重新下单</button>
                    </div>

                    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="resetForm()">返回</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">订单记录</div>
                <div class="orders-list" id="ordersList">
                    <div class="loading">暂无订单记录</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentOrder = null;
        let countdownTimer = null;
        let statusCheckTimer = null;
        let selectedPaymentMethod = 'alipay';

        async function createOrder() {
            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value;

            if (!amount || parseFloat(amount) <= 0) {
                alert('请输入有效的支付金额');
                return;
            }

            try {
                const response = await fetch('/api/order/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, description })
                });

                const result = await response.json();

                if (result.success) {
                    currentOrder = result.data;
                    await loadQRCode(currentOrder.orderId);
                    showPaymentSection();
                    startCountdown();
                    startStatusCheck();
                    loadOrders();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('创建订单失败:', error);
                alert('创建订单失败，请重试');
            }
        }

        async function loadQRCode(orderId) {
            try {
                const response = await fetch(`/api/order/${orderId}/qrcode`);
                const result = await response.json();

                if (result.success) {
                    document.getElementById('qrCode').src = result.data.qrCode;
                    document.getElementById('displayOrderId').textContent = result.data.orderId;
                    document.getElementById('displayAmount').textContent = `¥${result.data.amount.toFixed(2)}`;
                    updateStatusBadge('pending');
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('加载二维码失败:', error);
            }
        }

        function showPaymentSection() {
            document.getElementById('createOrderForm').classList.add('hidden');
            document.getElementById('paymentSection').classList.remove('hidden');
            document.getElementById('qrSection').classList.remove('hidden');
            document.getElementById('successSection').classList.add('hidden');
            document.getElementById('failedSection').classList.add('hidden');
            document.getElementById('displayDescription').textContent = currentOrder.description || '商品支付';
        }

        function startCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            
            countdownTimer = setInterval(() => {
                const remaining = currentOrder.expireAt - Date.now();
                
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    showFailedSection('订单已过期');
                    return;
                }

                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                document.getElementById('countdown').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function startStatusCheck() {
            if (statusCheckTimer) clearInterval(statusCheckTimer);
            
            statusCheckTimer = setInterval(async () => {
                if (!currentOrder) return;
                
                try {
                    const response = await fetch(`/api/order/${currentOrder.orderId}/status`);
                    const result = await response.json();

                    if (result.success) {
                        updateStatusBadge(result.data.status);
                        
                        if (result.data.status === 'paid') {
                            clearInterval(statusCheckTimer);
                            showSuccessSection();
                        } else if (result.data.status === 'expired' || result.data.status === 'cancelled') {
                            clearInterval(statusCheckTimer);
                            showFailedSection(result.data.status === 'expired' ? '订单已过期' : '订单已取消');
                        }
                    }
                } catch (error) {
                    console.error('检查订单状态失败:', error);
                }
            }, 2000);
        }

        function updateStatusBadge(status) {
            const statusMap = {
                'pending': { text: '待支付', class: 'status-pending' },
                'paid': { text: '已支付', class: 'status-paid' },
                'expired': { text: '已过期', class: 'status-expired' },
                'cancelled': { text: '已取消', class: 'status-cancelled' }
            };

            const statusInfo = statusMap[status] || statusMap['pending'];
            document.getElementById('displayStatus').innerHTML = 
                `<span class="status-badge ${statusInfo.class}">${statusInfo.text}</span>`;
        }

        function selectPaymentMethod(element) {
            document.querySelectorAll('.payment-method').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedPaymentMethod = element.dataset.method;
        }

        async function simulatePay() {
            if (!currentOrder) return;

            try {
                const response = await fetch(`/api/order/${currentOrder.orderId}/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentMethod: selectedPaymentMethod })
                });

                const result = await response.json();

                if (result.success) {
                    clearInterval(countdownTimer);
                    clearInterval(statusCheckTimer);
                    showSuccessSection();
                    loadOrders();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('支付失败:', error);
                alert('支付失败，请重试');
            }
        }

        async function cancelOrder() {
            if (!currentOrder) return;

            try {
                const response = await fetch(`/api/order/${currentOrder.orderId}/cancel`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (result.success) {
                    clearInterval(countdownTimer);
                    clearInterval(statusCheckTimer);
                    showFailedSection('订单已取消');
                    loadOrders();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('取消订单失败:', error);
            }
        }

        function showSuccessSection() {
            document.getElementById('qrSection').classList.add('hidden');
            document.getElementById('successSection').classList.remove('hidden');
            document.getElementById('failedSection').classList.add('hidden');
            updateStatusBadge('paid');
        }

        function showFailedSection(message) {
            document.getElementById('qrSection').classList.add('hidden');
            document.getElementById('successSection').classList.add('hidden');
            document.getElementById('failedSection').classList.remove('hidden');
            document.getElementById('failedMessage').textContent = message;
        }

        function resetForm() {
            clearInterval(countdownTimer);
            clearInterval(statusCheckTimer);
            currentOrder = null;
            
            document.getElementById('createOrderForm').classList.remove('hidden');
            document.getElementById('paymentSection').classList.add('hidden');
            document.getElementById('amount').value = '0.01';
            document.getElementById('description').value = '测试商品';
        }

        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    const ordersHtml = result.data.map(order => `
                        <div class="order-item" onclick="viewOrder('${order.id}')">
                            <div class="order-item-header">
                                <span class="order-item-id">${order.id}</span>
                                <span class="status-badge status-${order.status}">${getStatusText(order.status)}</span>
                            </div>
                            <div class="order-item-header">
                                <span class="order-item-amount">¥${order.amount.toFixed(2)}</span>
                                <span class="order-item-time">${formatTime(order.createdAt)}</span>
                            </div>
                        </div>
                    `).join('');
                    
                    document.getElementById('ordersList').innerHTML = ordersHtml;
                } else {
                    document.getElementById('ordersList').innerHTML = '<div class="loading">暂无订单记录</div>';
                }
            } catch (error) {
                console.error('加载订单列表失败:', error);
            }
        }

        function getStatusText(status) {
            const map = {
                'pending': '待支付',
                'paid': '已支付',
                'expired': '已过期',
                'cancelled': '已取消'
            };
            return map[status] || status;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }

        async function viewOrder(orderId) {
            try {
                const response = await fetch(`/api/order/${orderId}/qrcode`);
                const result = await response.json();

                if (result.success) {
                    currentOrder = result.data;
                    document.getElementById('qrCode').src = result.data.qrCode;
                    document.getElementById('displayOrderId').textContent = result.data.orderId;
                    document.getElementById('displayAmount').textContent = `¥${result.data.amount.toFixed(2)}`;
                    
                    const statusResponse = await fetch(`/api/order/${orderId}/status`);
                    const statusResult = await statusResponse.json();
                    
                    if (statusResult.success) {
                        updateStatusBadge(statusResult.data.status);
                        document.getElementById('displayDescription').textContent = statusResult.data.description || '商品支付';
                        
                        if (statusResult.data.status === 'pending') {
                            showPaymentSection();
                            startCountdown();
                            startStatusCheck();
                        } else if (statusResult.data.status === 'paid') {
                            showPaymentSection();
                            document.getElementById('qrSection').classList.add('hidden');
                            showSuccessSection();
                        } else {
                            showPaymentSection();
                            showFailedSection(getStatusText(statusResult.data.status));
                        }
                    }
                }
            } catch (error) {
                console.error('查看订单失败:', error);
            }
        }

        loadOrders();
    </script>
</body>
</html>
